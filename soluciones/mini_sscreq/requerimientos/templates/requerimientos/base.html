{% load static %}<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}mini-SSCReq{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <script src="{% static 'htmx.min.js' %}" defer></script>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <nav class="navbar bg-dark" data-bs-theme="dark">
    <div class="container">
      <a class="navbar-brand" href="{% url 'requerimientos:lista' %}">mini-SSCReq</a>
      <a class="nav-link text-light" href="{% url 'admin:index' %}">Administración</a>
    </div>
  </nav>
  <main class="container py-4">
    {% for m in messages %}
      <div class="alert alert-{% if m.tags == 'error' %}danger{% else %}{{ m.tags }}{% endif %}">{{ m }}</div>
    {% endfor %}
    {% block contenido %}{% endblock %}
  </main>

  <dialog id="modal" class="border-0 rounded shadow p-0" style="width: min(640px, 95vw)"
          hx-on:requerimiento-guardado="this.close()">
    <div id="modal-contenido"
         hx-on:htmx:after-swap="const m = document.getElementById('modal'); if (!m.open) m.showModal()">
    </div>
  </dialog>
</body>
</html>
