<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Requerimientos (práctica M2)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
  <main class="container py-4">
    <h1>Requerimientos</h1>

    <form method="get" action="" class="row g-2 mb-3">
      <div class="col-auto">
        <select name="estatus" class="form-select">
          <option value="">Todos los estatus</option>
          <option>Pendiente</option>
          <option>Autorizado</option>
          <option>Cancelado</option>
        </select>
      </div>
      <div class="col-auto">
        <button class="btn btn-outline-secondary">Filtrar</button>
      </div>
    </form>

    <!-- TODO: agrega las clases de Bootstrap "table table-striped table-hover" -->
    <table>
      <thead>
        <tr>
          <th>Folio</th>
          <th>Dependencia</th>
          <th>Proveedor</th>
          <th>Monto</th>
          <th>Estatus</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>SSC-0001/2026</td>
          <td>SSC</td>
          <td>Papelería Ficticia S.A.</td>
          <td>$1,500.00</td>
          <td><span class="badge text-bg-warning">Pendiente</span></td>
        </tr>
        <!-- TODO: agrega 3 filas más con datos ficticios; una debe estar Cancelado -->
      </tbody>
    </table>

    <h2 class="mt-4">Nuevo requerimiento</h2>
    <form method="post" action="/requerimientos/nuevo/">
      <div class="mb-3">
        <label for="folio" class="form-label">Folio</label>
        <input id="folio" name="folio" class="form-control" required placeholder="SSC-####/AAAA">
      </div>

      <!-- TODO: agrega los campos dependencia (select), proveedor (input),
           monto (number con step="0.01" y min="0") y descripción (textarea).
           Copia la estructura del bloque de folio. -->

      <button type="submit" class="btn btn-primary">Guardar</button>
    </form>
  </main>
</body>
</html>
